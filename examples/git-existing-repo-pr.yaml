# Existing/shared Git repository example.
# ConfigBackup uses a linked worktree and its own branch, so unrelated changes
# in the repository's normal checkout are left untouched.

backup:
  root: 'C:\ConfigBackup'
  include_hostname: true

git:
  repository: 'C:\Repos\Infrastructure'
  mode: pull_request
  remote_name: origin
  base_branch: auto
  branch: 'configbackup/{hostname}'
  push: true
  path_prefix: configbackup
  # Optional override. Default is %TEMP%\cbwt\<short-id>.
  # worktree_root: 'C:\cbwt'
  include_hostname: true
  ignore:
    - '**/*.ispac'
  author_name: ConfigBackup
  author_email: configbackup@example.invalid
  commit_message: 'ConfigBackup {hostname} {date} ({run_id})'
  pull_request:
    enabled: true
    provider: github
    repository: auto
    draft: false
    title: 'ConfigBackup: {hostname}'
    body: |
      Automated configuration snapshot for {hostname}.

      Generated by ConfigBackup {version}.
    reviewers: []
    labels: []

variables:
  SQL_STAGING: '${CONFIGBACKUP_STAGING}/sql-server'

tasks:
  # Example generated snapshot. A real configuration would normally have an
  # execute collector task that produces SQL_STAGING first.
  - name: sql-history
    type: directory
    source: ${SQL_STAGING}
    destination: sql-server
    storage: both
