backup:
  root: /srv/backups/configbackup
  include_hostname: true

variables:
  CONFIGBACKUP_HOME: /opt/configbackup
  SYSTEM_STAGING: ${CONFIGBACKUP_STAGING}/system

retention_policies:
  standard:
    active:
      mode: tiered
      min_versions: 3
      tiers:
        - interval: all
          duration_days: 7
        - interval: weekly
          duration_days: 90
        - interval: monthly
          forever: true
    deleted:
      mode: tiered
      min_versions: 3
      grace_days: 30
      tiers:
        - interval: all
          duration_days: 90
        - interval: monthly
          forever: true

defaults:
  retention_policy: standard

tasks:
  - name: collect-system
    type: execute
    phase: pre_backup
    executable: python3
    arguments:
      - ${CONFIGBACKUP_HOME}/collectors/system/collect_system.py
    output_directory: ${SYSTEM_STAGING}
    clean_output: true

  - name: system-inventory
    type: directory
    source: ${SYSTEM_STAGING}
    destination: system
    depends_on: [collect-system]

  - name: ssh
    type: directory
    source: /etc/ssh
    destination: etc/ssh

  - name: systemd-units
    type: glob
    source:
      - /etc/systemd/system/**/*.service
      - /etc/systemd/system/**/*.timer

  - name: app-configs
    type: glob
    source: /opt/**/config/**/*
    exclude:
      - '**/*.tmp'
      - '**/cache/**'
